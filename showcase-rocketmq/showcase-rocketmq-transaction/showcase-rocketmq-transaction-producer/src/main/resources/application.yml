spring:
  application:
    name: showcase-rocketmq-transaction-producer
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.56.1:3306/timmy?useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 1234
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 50
      # 连接池中允许的最大连接数。缺省值：10
      maximum-pool-size: 200
      # 自动提交
      auto-commit: true
      # 一个连接idle状态的最大时长（毫秒），超时则被释放（retired），缺省:10分钟
      idle-timeout: 600
      # 连接池名字
      pool-name: HikariCP
      # 一 个连接的生命时长（毫秒），超时而且没被使用则被释放（retired），缺省:30分钟，建议设置比数据库超时时长少30秒
      max-lifetime: 1800000
      # 等待连接池分配连接的最大时长（毫秒），超过这个时长还没可用的连接则发生SQLException， 缺省:30秒
      connection-timeout: 30000
  redis:
    host: 192.168.56.1
    port: 6379
    timeout: 2000 # 连接或读取超时时长（毫秒）
    database: 1
    jedis:
      pool:
        max-active: 8
        max-wait: 800
        max-idle: 8
        min-idle: 2
rocketmq:
  name-server: 172.31.184.43:9876
  producer:
    sendMessageTimeout: 300000
    maxMessageSize: 131072
    group: timmy-group

logging:
  level:
    root: info
  file:
    path: /home/timmy/workspace/hand-run/rocketmq/producer/log
    name: producer.log

showcase:
  rocketmq:
    transaction:
      topic: transaction_message_topic:transaction_message_topic_tag