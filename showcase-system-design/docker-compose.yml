services:
  skywalking-oap:
    image: apache/skywalking-oap-server:9.5.0
    container_name: skywalking-oap
    ports:
      - "11800:11800" # gRPC for agents
      - "12800:12800" # HTTP for UI
    environment:
      # Storage provider
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure

  skywalking-ui:
    image: apache/skywalking-ui:9.5.0
    container_name: skywalking-ui
    ports:
      - "8089:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      - skywalking-oap

  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # ===== KRaft 必须配置 =====
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ===== Listener =====
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ===== 基础配置 =====
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ===== 日志目录 =====
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  eureka:
    image: showcase/showcase-system-design-base-eureka-server:1.0-SNAPSHOT
    container_name: eureka-server
    platform: linux/amd64
    ports:
      - "8761:8761"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: eureka-server
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_LOGGING_DIR: /tmp/skywalking/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      - skywalking-oap
  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
  gateway:
    image: showcase/showcase-system-design-base-gateway:1.0-SNAPSHOT
    container_name: gateway
    platform: linux/amd64
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: gateway
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_LOGGING_DIR: /tmp/skywalking/logs
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
  fef:
    image: showcase/showcase-system-design-fef-service:1.0-SNAPSHOT
    container_name: fef
    platform: linux/amd64
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: fep
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_LOGGING_DIR: /tmp/skywalking/logs
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro

  pay:
    image: showcase/showcase-system-design-pay-service:1.0-SNAPSHOT
    platform: linux/amd64
    expose:
      - 8081
    depends_on:
      - gateway
      - mysql
      - redis
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # redisson-spring-boot-starter 使用 spring.redis.redisson.config
      SPRING_REDIS_REDISSON_CONFIG: |
        singleServerConfig:
          address: "redis://redis:6379"
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: pay-service
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_LOGGING_DIR: /tmp/skywalking/logs
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
  channel:
    image: showcase/showcase-system-design-channel-service:1.0-SNAPSHOT
    platform: linux/amd64
    expose:
      - 8082
    depends_on:
      - gateway
      - mysql
      - redis
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # redisson-spring-boot-starter 使用 spring.redis.redisson.config
      SPRING_REDIS_REDISSON_CONFIG: |
        singleServerConfig:
          address: "redis://redis:6379"
      JAVA_TOOL_OPTIONS: -javaagent:/skywalking/agent/skywalking-agent.jar
      SW_AGENT_NAME: channel-service
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_LOGGING_DIR: /tmp/skywalking/logs
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro