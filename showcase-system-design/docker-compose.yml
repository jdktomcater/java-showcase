services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pay
      MYSQL_USER: pay
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # ===== KRaft 必须配置 =====
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ===== Listener =====
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ===== 基础配置 =====
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ===== 日志目录 =====
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  eureka:
    image: showcase/showcase-system-design-base-eureka-server:1.0-SNAPSHOT
    container_name: eureka-server
    platform: linux/amd64
    ports:
      - "8761:8761"
  gateway:
    image: showcase/showcase-system-design-base-gateway:1.0-SNAPSHOT
    container_name: gateway
    platform: linux/amd64
    ports:
      - "7000:7000"
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

  pay:
    image: showcase/showcase-system-design-pay:1.0-SNAPSHOT
    container_name: pay-service
    platform: linux/amd64
    ports:
      - "8081:8081"
    depends_on:
      - eureka
      - gateway
      - mysql
      - redis
      - kafka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # redisson-spring-boot-starter 使用 spring.redis.redisson.config
      SPRING_REDIS_REDISSON_CONFIG: |
        singleServerConfig:
          address: "redis://redis:6379"
