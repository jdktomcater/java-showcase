server:
  port: 8081
spring:
  application:
    name: pay-service
  redis:
    redisson:
      # redisson-spring-boot-starter 需要通过 config/file 注入配置
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          database: 0
          timeout: 3000
          connectionPoolSize: 64
          connectionMinimumIdleSize: 24
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/pay?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: pay
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#  kafka:
#    bootstrap-servers: localhost:9092
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#    consumer:
#      group-id: pay-system
#      auto-offset-reset: earliest
#      enable-auto-commit: false

logging:
  level:
    root: info
  config: classpath:logback.xml
  file:
    name: /data/log/pay-service.log

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/