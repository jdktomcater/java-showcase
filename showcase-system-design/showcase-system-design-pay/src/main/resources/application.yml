server:
  port: 8081
spring:
  application:
    name: pay-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/pay?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: pay
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
