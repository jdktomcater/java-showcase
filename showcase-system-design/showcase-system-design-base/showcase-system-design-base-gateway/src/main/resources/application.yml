server:
  port: 7000
spring:
  application:
    name: gateway
  cloud:
    inetutils:
      use-only-site-local-interfaces: true
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 20s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: route-pay
          uri: lb://pay-service
          predicates:
            - Path=/pay/**
        - id: route-page
          uri: lb://fef-service
          predicates:
            - Path=/page/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    root: info
  config: classpath:logback.xml
  file:
    name: /data/log/gateway.log
# eureka client
eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka