server:
  port: 8083
spring:
  application:
    name: risk-service
  redis:
    redisson:
      # redisson-spring-boot-starter 需要通过 config/file 注入配置
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          database: 0
          timeout: 3000
          connectionPoolSize: 64
          connectionMinimumIdleSize: 24
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/pay?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: pay
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

logging:
  level:
    root: info
  config: classpath:logback.xml
  file:
    name: /data/log/pay-service.log

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      channel-service:
        failureRateThreshold: 50        # 失败率 %
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
