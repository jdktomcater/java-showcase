services:
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2182:2181"
    restart: always
  kafka1:
    image: wurstmeister/kafka
    container_name: kafka1
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.18.0.2:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.18.0.5:9093
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k1:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
  kafka2:
    image: wurstmeister/kafka
    container_name: kafka2
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.18.0.2:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.18.0.4:9094
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k2:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
  kafka3:
    image: wurstmeister/kafka
    container_name: kafka3
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.18.0.2:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.18.0.3:9095
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k3:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always