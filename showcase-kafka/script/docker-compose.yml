services:
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2182:2181"
    restart: always
    networks:
      kafka-net:
        ipv4_address: 172.19.0.2
  kafka1:
    image: wurstmeister/kafka
    container_name: kafka1
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.19.0.2:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.19.0.3:9092
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k1:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      kafka-net:
        ipv4_address: 172.19.0.3
  kafka2:
    image: wurstmeister/kafka
    container_name: kafka2
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.19.0.2:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.19.0.4:9092
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k2:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      kafka-net:
        ipv4_address: 172.19.0.4
  kafka3:
    image: wurstmeister/kafka
    container_name: kafka3
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: 172.19.0.2:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.19.0.5:9092
    volumes:
      - /Users/timmy/workspace/idea/java-showcase/showcase-kafka/logs/k3:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      kafka-net:
        ipv4_address: 172.19.0.5

networks:
  kafka-net:
    ipam:
      config:
        - subnet: 172.19.0.0/16