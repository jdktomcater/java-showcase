server:
  port: 8080

spring:
  application:
    name: vault-data
  config:
    import: optional:vault://
  cloud:
    vault:
      authentication: TOKEN
      token: hvs.pER0xhc85jcsKkVLr3oe0UxE
      enabled: true
      uri: https://txdev-vault.qwasn.com
      kv:
        enabled: false
      database:
        backend: database
        enabled: true
        role: tx-typayv2slave-role
        username-property: spring.datasource.username
        password-property: spring.datasource.password
      config:
        lifecycle:
          min-renewal: 4s
          enabled: true
          lease-endpoints: Leases
      fail-fast: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.30.3.16:3366/typayv2?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2b8
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
#    username: root
#    password: 12345678
logging:
  level:
    org.springframework.cloud.vault: DEBUG
    org.springframework.vault: DEBUG
  config: classpath:logback.xml