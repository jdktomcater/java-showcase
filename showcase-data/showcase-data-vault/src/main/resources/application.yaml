server:
  port: 8080
spring:
  application:
    name: vault-data
  config:
    import: optional:vault://
  cloud:
    vault:
      authentication: CERT
      enabled: true
      uri: https://127.0.0.1:8200
      ssl:
        trust-store: classpath:vault-truststore.jks
        trust-store-password: 123456
        trust-store-type: JKS
        key-store: classpath:client.p12
        key-store-password: 1234
        key-store-type: PKCS12
      kv:
        enabled: false
      database:
        backend: database
        enabled: true
        role: local_mac_role
        username-property: spring.datasource.username
        password-property: spring.datasource.password
      config:
        lifecycle:
          min-renewal: 4s
          enabled: true
          lease-endpoints: Leases
      fail-fast: true
#      app-role:
#        role-id: ff73aca2-1981-44a0-4f29-1130af37522e
#        secret-id: 2afa8b3a-1cc5-2895-7522-1becf0150d10
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/pay?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2b8
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
logging:
  level:
    org.springframework.cloud.vault: DEBUG
    org.springframework.vault: DEBUG
    org.springframework.http.client: DEBUG
  config: classpath:logback.xml