worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    server {
        listen       8080;
        server_name  _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /proxy-status {
            root /usr/share/nginx/html;
            try_files /proxy-status.txt =404;
        }
    }
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
