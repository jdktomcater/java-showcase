services:
  mysql1:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.32}
    container_name: showcase-mgr-mysql1
    hostname: mysql1
    environment:
      MYSQL_ROOT_PASSWORD: root@123456
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --ssl-mode=REQUIRED ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - mysql1-data:/var/lib/mysql
      - ./conf/mysql1/my.cnf:/etc/mysql/conf.d/z-mgr.cnf:ro
      - ./init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./certs/ca/ca.pem:/certs/ca.pem:ro
      - ./certs/mysql1/server-cert.pem:/certs/server-cert.pem:ro
      - ./certs/mysql1/server-key.pem:/certs/server-key.pem:ro

  mysql2:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.32}
    container_name: showcase-mgr-mysql2
    hostname: mysql2
    environment:
      MYSQL_ROOT_PASSWORD: root@123456
    ports:
      - "33062:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --ssl-mode=REQUIRED ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - mysql2-data:/var/lib/mysql
      - ./conf/mysql2/my.cnf:/etc/mysql/conf.d/z-mgr.cnf:ro
      - ./init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./certs/ca/ca.pem:/certs/ca.pem:ro
      - ./certs/mysql2/server-cert.pem:/certs/server-cert.pem:ro
      - ./certs/mysql2/server-key.pem:/certs/server-key.pem:ro

  mysql3:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.32}
    container_name: showcase-mgr-mysql3
    hostname: mysql3
    environment:
      MYSQL_ROOT_PASSWORD: root@123456
    ports:
      - "33063:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --ssl-mode=REQUIRED ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - mysql3-data:/var/lib/mysql
      - ./conf/mysql3/my.cnf:/etc/mysql/conf.d/z-mgr.cnf:ro
      - ./init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./certs/ca/ca.pem:/certs/ca.pem:ro
      - ./certs/mysql3/server-cert.pem:/certs/server-cert.pem:ro
      - ./certs/mysql3/server-key.pem:/certs/server-key.pem:ro

  mgr-setup:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.32}
    container_name: showcase-mgr-setup
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
      mysql3:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: root@123456
      MGR_REPL_PASSWORD: Repl#123456
    restart: "no"
    volumes:
      - ./scripts/bootstrap-mgr.sh:/bootstrap-mgr.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap-mgr.sh"]

  mgr-cluster-metadata-setup:
    image: mysql/mysql-server:${MYSQL_IMAGE_TAG:-8.0.32}
    platform: linux/amd64
    container_name: showcase-mgr-cluster-metadata-setup
    depends_on:
      mgr-setup:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: root@123456
      MGR_CLUSTER_NAME: showcaseCluster
    restart: "no"
    volumes:
      - ./scripts/bootstrap-cluster-metadata.sh:/bootstrap-cluster-metadata.sh:ro
      - ./certs/ca/ca.pem:/certs/ca.pem:ro
    entrypoint: ["/bin/bash", "/bootstrap-cluster-metadata.sh"]

  mysql-router:
    image: mysql/mysql-router:${MYSQL_ROUTER_IMAGE_TAG:-8.0.32}
    platform: linux/amd64
    container_name: showcase-mysql-router
    hostname: mysql-router
    depends_on:
      mgr-cluster-metadata-setup:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root@123456
      MYSQL_INNODB_CLUSTER_MEMBERS: 3
      MYSQL_ROUTER_BOOTSTRAP_EXTRA_OPTIONS: "--ssl-mode=VERIFY_CA --ssl-ca=/router/certs/ca.pem --client-ssl-mode=PASSTHROUGH"
    ports:
      - "16446:6446"
      - "16447:6447"
    restart: on-failure
    volumes:
      - ./certs/ca/ca.pem:/router/certs/ca.pem:ro

  f5-mgr-proxy:
    build:
      context: ./f5-proxy
    container_name: showcase-f5-mgr-proxy
    hostname: f5-mgr-proxy
    depends_on:
      mysql-router:
        condition: service_started
    environment:
      RW_BACKENDS: mysql-router:6446
      RO_BACKENDS: mysql-router:6447
      MGR_RW_LISTEN_PORT: 3306
      MGR_RO_LISTEN_PORT: 3307
      STATUS_PORT: 8080
    ports:
      - "13306:3306"
      - "13307:3307"
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql1-data:
  mysql2-data:
  mysql3-data:
