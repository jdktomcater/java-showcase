spring:
  application:
    name: showcase-data-driver
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://172.30.3.16:3366/typayv2?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&sessionVariables=max_execution_time=1000
    username: ${MYSQL_USERNAME:tx_test}
    password: ${MYSQL_PASSWORD:WQR2A0uUVMjGon1puQ}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initialSize: 30
      minIdle: 30
      maxActive: 200
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      validationQueryTimeout: 3
      testWhileIdle: true
      testOnBorrow: true
      testOnReturn: true
      test-while-idle: true
      validation-query: SELECT 1
      filters: stat

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.jdktomcat.showcase.data.driver.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  benchmark:
    enabled: true

logging:
  level:
    com.jdktomcat.showcase.data.driver: INFO
