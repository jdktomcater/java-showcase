services:
  eureka:
    image: showcase/showcase-spring-cloud-eureka-server:1.0.0-SNAPSHOT
    container_name: eureka
    platform: linux/amd64
    ports:
      - "8761:8761"
  gateway:
    image: showcase/showcase-spring-cloud-gateway-api:1.0.0-SNAPSHOT
    container_name: gateway
    platform: linux/amd64
    ports:
      - "7000:7001"
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/