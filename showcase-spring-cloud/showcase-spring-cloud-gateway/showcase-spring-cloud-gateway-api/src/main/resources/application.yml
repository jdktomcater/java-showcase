server:
  port: 7000
spring:
  application:
    name: showcase-spring-cloud-gateway-api
  cloud:
    inetutils:
      use-only-site-local-interfaces: true
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 20s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: route-service
          uri: lb://pay-service
          predicates:
            - Path=/pay/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# eureka client
eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka