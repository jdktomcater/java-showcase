services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: code-rag-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_rag"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
