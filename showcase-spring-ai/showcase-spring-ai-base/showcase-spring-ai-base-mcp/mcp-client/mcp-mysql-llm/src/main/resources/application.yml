server:
  port: 8092

spring:
  application:
    name: mcp-mysql-llm

  ai:
    # ===== Ollama 本地模型 =====
    # 需提前启动 Ollama，并 pull 一个支持 tools/function-calling 的模型，
    # 例如：ollama pull qwen2.5:7b   或   ollama pull llama3.1:8b
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3-coder:480b-cloud
          temperature: 0.1

    # ===== MCP Client =====
    # 默认连接到 mcp-gateway（8095 端口），由网关再按命名空间路由到 mcp-mysql-server。
    # 网关要求 API Key，这里通过 sse-endpoint query 参数传入；网关会把 api_key 继续附加到 message endpoint。
    mcp:
      client:
        type: SYNC
        name: mcp-mysql-llm
        version: 1.0.0
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          connections:
            mysql-gateway:
              url: http://localhost:8095
              sse-endpoint: /sse?api_key=demo-gateway-key

logging:
  level:
    com.jdktomcat.showcase.spring.ai.mcp: INFO
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: INFO
    org.springframework.ai.chat: INFO
