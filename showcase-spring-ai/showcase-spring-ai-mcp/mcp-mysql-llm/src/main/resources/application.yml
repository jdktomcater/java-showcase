server:
  port: 8092

spring:
  application:
    name: mcp-mysql-llm

  ai:
    # ===== Ollama 本地模型 =====
    # 需提前启动 Ollama，并 pull 一个支持 tools/function-calling 的模型，
    # 例如：ollama pull qwen2.5:7b   或   ollama pull llama3.1:8b
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.1

    # ===== MCP Client =====
    # 连接到 mcp-mysql-server（默认 8090 端口），并把远端 Tool 自动暴露为 ToolCallback
    mcp:
      client:
        type: SYNC
        name: mcp-mysql-llm
        version: 1.0.0
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          connections:
            mysql-server:
              url: http://localhost:8090
              sse-endpoint: /sse

logging:
  level:
    com.jdktomcat.showcase.spring.ai.mcp: INFO
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: INFO
    org.springframework.ai.chat: INFO
