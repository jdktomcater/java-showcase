server:
  port: 8000

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  api:
    token: ${GITHUB_API_TOKEN:}
  review:
    max-diff-length: 12000
    publish-check-run: ${GITHUB_REVIEW_PUBLISH_CHECK_RUN:false}
    publish-status: ${GITHUB_REVIEW_PUBLISH_STATUS:true}
    publish-pr-comment: ${GITHUB_REVIEW_PUBLISH_PR_COMMENT:false}
    publish-pr-review: ${GITHUB_REVIEW_PUBLISH_PR_REVIEW:true}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    ollama:
      init:
        timeout: 60m
        max-retries: 10
        embedding:
          additional-models:
            - ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
        pull-model-strategy: when_missing
      baseUrl: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5-coder:7b}


# 日志配置（便于调试流程）
logging:
  level:
    org.langchain4j: DEBUG
    com.jdktomcat.showcase.ai.langgraph4j: DEBUG

