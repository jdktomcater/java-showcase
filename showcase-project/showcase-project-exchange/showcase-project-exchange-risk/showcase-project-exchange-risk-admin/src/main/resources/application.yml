server:
  port: 8095

spring:
  application:
    name: exchange-risk-admin

  datasource:
    url: jdbc:h2:mem:exchange_risk;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.jdktomcat.showcase.project.exchange.risk: info

---
# MySQL profile for production-like deployment
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exchange_risk?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: exchange_risk
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: never
