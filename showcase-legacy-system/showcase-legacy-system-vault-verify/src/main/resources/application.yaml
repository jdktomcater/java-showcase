server:
  port: 8000

spring:
  application:
    name: showcase-vault-verify
  config:
    import: "optional:vault://"

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      typayv2slave:
        url: "jdbc:mysql://127.0.0.1:3306/pay?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2b8"
      initial-size: 2
      minIdle: 2
      maxActive: 30
      maxWait: 5000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 500000
      validationQuery: "SELECT 1"
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
      filter:
        stat:
          enabled: true

  cloud:
    vault:
      enabled: true
      fail-fast: true
      authentication: APPROLE
      uri: https://127.0.0.1:8200
      kv:
        enabled: false
      app-role:
        role: verify-role
        role-id: a21bfc9d-8e8e-5a5c-6fc7-8aaef07ad281
        secret-id: 9517e0b3-e6e4-ebe5-8f91-306b84239d1d
      read-timeout: 15000
      config:
        lifecycle:
          enabled: true
          min-renewal: 3s
          lease-endpoints: leases
      databases:
        typayv2slave:
          enabled: true
          backend: database
          role: verify-role
          username-property: spring.datasource.druid.typayv2slave.username
          password-property: spring.datasource.druid.typayv2slave.password

management:
  server:
    port: 18000
  endpoints:
    web:
      exposure:
        include:
          - health
          - pause
          - restart
  endpoint:
    pause:
      enabled: true
    restart:
      enabled: true

logging:
  level:
    org.springframework.cloud.vault: debug
    org.springframework.vault: debug
  config: classpath:logback.xml
  file:
    name: /data/logs/showcase/showcase-vault-verify.log

verify:
  target:
    ids: "30072,30073,30074,30075,30076,30077,30078,30079"