server.port=8000
spring.application.name=showcase-vault-verify
spring.config.import=optional:vault://
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.datasource.druid.typayv2slave.url=jdbc:mysql://172.30.3.16:3366/typayv2?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2b8

spring.datasource.druid.initialSize=5
spring.datasource.druid.minIdle=2
spring.datasource.druid.maxActive=10
spring.datasource.druid.maxWait=5000
spring.datasource.druid.timeBetweenEvictionRunsMillis=5000
spring.datasource.druid.minEvictableIdleTimeMillis=30000
spring.datasource.druid.maxEvictableIdleTimeMillis=30000
spring.datasource.druid.validationQuery=SELECT 1 FROM DUAL
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false

spring.datasource.druid.webStatFilter.enabled=false
spring.datasource.druid.statViewServlet.enabled=false
spring.datasource.druid.filter.stat.enabled=false
spring.datasource.druid.filter.wall.enabled=false
spring.datasource.druid.filter.slf4j.enabled=false
spring.datasource.druid.filter.log4j2.enabled=false
spring.datasource.druid.filter.log4j.enabled=false
spring.datasource.druid.filter.commons-log.enabled=false

logging.level.org.springframework.cloud.vault=debug
logging.level.org.springframework.vault=debug

logging.config=classpath:logback.xml

logging.file.name=/data/logs/showcase/showcase-vault-verify.log

# ---------------- Vault (VM: AppRole + database dynamic credentials) ----------------
spring.cloud.vault.enabled=true
spring.cloud.vault.fail-fast=true
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role=tx-fat-role
spring.cloud.vault.app-role.role-id=9e7aabf1-a1b4-b8c0-126f-0e0456cd2a7e
spring.cloud.vault.app-role.secret-id=54985b69-0689-1203-06a2-f9becaa7b873
spring.cloud.vault.uri=https://txdev-vault.qwasn.com
spring.cloud.vault.kv.enabled=false
spring.cloud.vault.config.lifecycle.enabled=true
spring.cloud.vault.config.lifecycle.min-renewal=3s
spring.cloud.vault.config.lifecycle.lease-endpoints=leases

# Vault Database Secrets Engine: database/creds/<role>
spring.cloud.vault.databases.typayv2slave.enabled=true
spring.cloud.vault.databases.typayv2slave.backend=database
spring.cloud.vault.databases.typayv2slave.role=htx-mathcup-pay-role-v1
spring.cloud.vault.databases.typayv2slave.username-property=spring.datasource.druid.typayv2slave.username
spring.cloud.vault.databases.typayv2slave.password-property=spring.datasource.druid.typayv2slave.password

verify.target.ids=30072,30073,30074,30075,30076,30077,30078,30079