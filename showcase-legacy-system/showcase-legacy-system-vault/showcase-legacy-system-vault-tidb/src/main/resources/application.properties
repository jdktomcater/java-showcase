# Vault Database Secrets Engine: database/creds/<role>
spring.cloud.vault.database.enabled=true
spring.cloud.vault.database.backend=database
spring.cloud.vault.database.role=tidb_role
spring.cloud.vault.database.username-property=spring.datasource.druid.typayv2slave.username
spring.cloud.vault.database.password-property=spring.datasource.druid.typayv2slave.password
spring.cloud.vault.config.lifecycle.enabled=true
spring.cloud.vault.config.lifecycle.min-renewal=4s
spring.cloud.vault.config.lifecycle.lease-endpoints=Legacy