server.port=8000
spring.application.name=showcase-vault-simple
spring.config.import=optional:vault://
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.datasource.druid.typayv2slave.url=jdbc:mysql://172.30.3.16:3366/typayv2?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2b8

spring.datasource.druid.initialSize=2
spring.datasource.druid.minIdle=2
spring.datasource.druid.maxActive=4
spring.datasource.druid.maxWait=60000
spring.datasource.druid.timeBetweenEvictionRunsMillis=60000
spring.datasource.druid.minEvictableIdleTimeMillis=300000
spring.datasource.druid.maxEvictableIdleTimeMillis=900000
spring.datasource.druid.validationQuery=SELECT 1 FROM DUAL
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false

spring.datasource.druid.webStatFilter.enabled=false
spring.datasource.druid.statViewServlet.enabled=false
spring.datasource.druid.filter.stat.enabled=false
spring.datasource.druid.filter.wall.enabled=false
spring.datasource.druid.filter.slf4j.enabled=false
spring.datasource.druid.filter.log4j2.enabled=false
spring.datasource.druid.filter.log4j.enabled=false
spring.datasource.druid.filter.commons-log.enabled=false

logging.level.org.springframework.cloud.vault=debug
logging.level.org.springframework.vault=debug
logging.config=classpath:logback.xml
logging.file.name=/data/logs/showcase/showcase-vault-simple.log

# ---------------- Vault (VM: AppRole + database dynamic credentials) ----------------
spring.cloud.vault.enabled=true
spring.cloud.vault.fail-fast=true
#spring.cloud.vault.authentication=${VAULT_AUTHENTICATION:APPROLE}
#spring.cloud.vault.app-role.role=${VAULT_AUTHENTICATION_ROLE:tx-fat-role}
#spring.cloud.vault.app-role.role-id=${VAULT_AUTHENTICATION_ROLE_ID:9e7aabf1-a1b4-b8c0-126f-0e0456cd2a7e}
#spring.cloud.vault.app-role.secret-id=${VAULT_AUTHENTICATION_SECRET_ID:54985b69-0689-1203-06a2-f9becaa7b873}
#spring.cloud.vault.authentication=${VAULT_AUTHENTICATION:TOKEN}
#spring.cloud.vault.token=${VAULT_TOKEN:hvs.pER0xhc85jcsKkVLr3oe0UxE}
spring.cloud.vault.uri=${VAULT_URI:https://txdev-vault.qwasn.com}
spring.cloud.vault.kv.enabled=false
spring.cloud.vault.config.lifecycle.enabled=true
spring.cloud.vault.config.lifecycle.min-renewal=4s
spring.cloud.vault.config.lifecycle.lease-endpoints=Legacy

spring.cloud.vault.authentication=CERT
#spring.cloud.vault.uri=https://127.0.0.1:8200
spring.cloud.vault.ssl.trust-store=classpath:vault-truststore.jks
spring.cloud.vault.ssl.trust-store-password=123456
spring.cloud.vault.ssl.trust-store-type=JKS
spring.cloud.vault.ssl.key-store=classpath:client.p12
spring.cloud.vault.ssl.key-store-password=1234
spring.cloud.vault.ssl.key-store-type=PKCS12

# Vault Database Secrets Engine: database/creds/<role>
spring.cloud.vault.database.enabled=true
spring.cloud.vault.database.backend=database
spring.cloud.vault.database.role=tx_fat_role_simple
spring.cloud.vault.database.username-property=spring.datasource.druid.typayv2slave.username
spring.cloud.vault.database.password-property=spring.datasource.druid.typayv2slave.password