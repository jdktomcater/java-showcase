services:
  redis-node-1:
    image: redis:6.2.17
    command: redis-server /conf/redis.conf --port 7001
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - ./redis-node-1:/data
      - ./conf:/conf
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7001", "PING" ]
      interval: 5s
      timeout: 2s
      retries: 10
