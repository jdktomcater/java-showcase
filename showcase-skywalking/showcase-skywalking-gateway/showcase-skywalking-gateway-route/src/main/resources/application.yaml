server:
  port: 7000
spring:
  application:
    name: showcase-skywalking-gateway-route
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 5s
        pool:
          max-connections: 10000
          acquire-timeout: 5000
          type: fixed
          max-idle-time: 5000
logging:
  level:
    root: info
  config: classpath:logback.xml