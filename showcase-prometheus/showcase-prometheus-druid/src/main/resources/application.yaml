spring:
  application:
    name: prometheus-druid
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      order:
        initial-size: 10
        max-active: 20
        min-idle: 10
        name: typayv2
        url: jdbc:mysql://127.0.0.1:3306/order?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
        username: root
        password: 1234
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    metrics:
      enabled: true
  server:
    port: 8083
  prometheus:
    metrics:
      export:
        enabled: true