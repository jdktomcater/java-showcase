server:
  port: 7000

spring:
  application:
    name: showcase-springcloud-gateway-api
  cloud:
    gateway:
      httpclient:
        connect-timeout: 50000
        response-timeout: 20s
        pool:
          max-connections: 2000
          type: fixed
logging:
  level:
    root: info
  config: classpath:logback.xml