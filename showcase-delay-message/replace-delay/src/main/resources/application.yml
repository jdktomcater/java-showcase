spring:
  application:
    name: showcase-replace-delay
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    # 过期事件订阅，接收7号数据库中所有key的过期事件
    listen-pattern: __keyevent@0__:expired
    jedis:
      pool:
        max-active: 8
        max-wait: 800
        max-idle: 8
        min-idle: 2
rocketmq:
  name-server: 172.31.184.43:9876
  producer:
    group: timmy-group
    instance: delayProducer
    max-message-size: 131072
    send-message-timeout: 10000

# properties used in the application
demo:
  rocketmq:
    topic: timmy-topic
    tag: delay
    tlsEnable: false

logging:
  level:
    com:
      jdktomcat:
        showcase:
          delay: info