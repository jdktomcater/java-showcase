spring:
  application:
    name: showcase-replace-delay
  main:
    allow-circular-references: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 过期事件订阅，接收7号数据库中所有key的过期事件
      listen-pattern: __keyevent@0__:expired

rocketmq:
  namesrvAddr: 172.30.2.14:9876
  producer:
    groupName: orderProducerGroup
    instanceName: orderProducer
    maxMessageSize: 131072
    sendMsgTimeout: 10000
    retryTimesWhenSendFailed: 5
  consumer:
    groupName: orderConsumerGroup
    instanceName: orderConsumer
    consumeThreadMin: 20
    consumeThreadMax: 64
    batchMaxSize: 1

order.state.delay.mq.enable: true
order.state.delay.redis.enable: true
order.state.delay.redis.ttl.time.difference: 500