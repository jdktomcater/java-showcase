services:
  kafka_broker_1:
    image: 'apache/kafka:4.3.0'
    container_name: kafka_broker_1
    user: root
    ports:
      - "9192:9092"
      - "9193:9093"
    environment:
      ### 通用配置
      # 集群id，集群内所有节点必须一致
      - CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      # kafka角色，做broker，也要做controller
      - KAFKA_PROCESS_ROLES=broker,controller
      # 指定供外部使用的控制类请求信息
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # 定义kafka服务端socket监听端口（PLAINTEXT:外部, INTERNAL:容器内部, CONTROLLER:选举）
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # 定义安全协议
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      # 集群间通信使用内部监听器
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # 集群地址
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_broker_1:9093,2@kafka_broker_2:9093,3@kafka_broker_3:9093
      # 设置broker最大内存，和初始内存
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      # 不允许自动创建主题
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      ### broker配置
      # 外部客户端走宿主机ip，容器内部（kafka-ui等）走容器hostname
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9192,INTERNAL://kafka_broker_1:29092
      # node.id，必须唯一（KRaft模式替代broker.id）
      - KAFKA_NODE_ID=1
    volumes:
      - ./data/kafka_broker_1:/var/lib/kafka/data
    #extra_hosts:
      #- "kafka1:云服务器IP"
      #- "kafka2:云服务器IP"
      #- "kafka3:云服务器IP"

  kafka_broker_2:
    image: 'apache/kafka:4.3.0'
    container_name: kafka_broker_2
    user: root
    ports:
      - "9292:9092"
      - "9293:9093"
    environment:
      ### 通用配置
      # 集群id，集群内所有节点必须一致
      - CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      # kafka角色，做broker，也要做controller
      - KAFKA_PROCESS_ROLES=broker,controller
      # 指定供外部使用的控制类请求信息
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # 定义kafka服务端socket监听端口
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # 定义安全协议
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      # 集群间通信使用内部监听器
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # 集群地址
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_broker_1:9093,2@kafka_broker_2:9093,3@kafka_broker_3:9093
      # 设置broker最大内存，和初始内存
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      # 不允许自动创建主题
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      ### broker配置
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9292,INTERNAL://kafka_broker_2:29092
      # node.id，必须唯一（KRaft模式替代broker.id）
      - KAFKA_NODE_ID=2
    volumes:
      - ./data/kafka_broker_2:/var/lib/kafka/data

  kafka_broker_3:
    image: 'apache/kafka:4.3.0'
    container_name: kafka_broker_3
    user: root
    ports:
      - "9392:9092"
      - "9393:9093"
    environment:
      ### 通用配置
      # 集群id，集群内所有节点必须一致
      - CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      # kafka角色，做broker，也要做controller
      - KAFKA_PROCESS_ROLES=broker,controller
      # 指定供外部使用的控制类请求信息
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # 定义kafka服务端socket监听端口
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # 定义安全协议
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      # 集群间通信使用内部监听器
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # 集群地址
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_broker_1:9093,2@kafka_broker_2:9093,3@kafka_broker_3:9093
      # 设置broker最大内存，和初始内存
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      # 不允许自动创建主题
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      ### broker配置
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9392,INTERNAL://kafka_broker_3:29092
      # node.id，必须唯一（KRaft模式替代broker.id）
      - KAFKA_NODE_ID=3
    volumes:
      - ./data/kafka_broker_3:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=KRaft-Cluster
      # 使用INTERNAL监听器地址，容器间直接通信，不经过宿主机
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka_broker_1:29092,kafka_broker_2:29092,kafka_broker_3:29092
    depends_on:
      - kafka_broker_1
      - kafka_broker_2
      - kafka_broker_3
