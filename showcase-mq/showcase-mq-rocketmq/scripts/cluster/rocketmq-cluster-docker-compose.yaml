version: '3.8'

services:
  # RocketMQ Name Server
  rmqnamesrv:
    image: apache/rocketmq:5.1.4
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ./logs/namesrv:/home/rocketmq/logs
      - ./store/namesrv:/home/rocketmq/store
    environment:
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn256m
    command: sh mqnamesrv
    networks:
      - rocketmq-network

  # RocketMQ Broker Master 1
  rmqbroker-master-1:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker-master-1
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./logs/broker-master-1:/home/rocketmq/logs
      - ./store/broker-master-1:/home/rocketmq/store
      - ./conf/broker-master-1.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    depends_on:
      - rmqnamesrv
    networks:
      - rocketmq-network

  # RocketMQ Broker Slave 1
  rmqbroker-slave-1:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker-slave-1
    ports:
      - "11909:10909"
      - "11911:10911"
      - "11912:10912"
    volumes:
      - ./logs/broker-slave-1:/home/rocketmq/logs
      - ./store/broker-slave-1:/home/rocketmq/store
      - ./conf/broker-slave-1.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    depends_on:
      - rmqnamesrv
      - rmqbroker-master-1
    networks:
      - rocketmq-network

  # RocketMQ Broker Master 2
  rmqbroker-master-2:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker-master-2
    ports:
      - "12909:10909"
      - "12911:10911"
      - "12912:10912"
    volumes:
      - ./logs/broker-master-2:/home/rocketmq/logs
      - ./store/broker-master-2:/home/rocketmq/store
      - ./conf/broker-master-2.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    depends_on:
      - rmqnamesrv
    networks:
      - rocketmq-network

  # RocketMQ Broker Slave 2
  rmqbroker-slave-2:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker-slave-2
    ports:
      - "13909:10909"
      - "13911:10911"
      - "13912:10912"
    volumes:
      - ./logs/broker-slave-2:/home/rocketmq/logs
      - ./store/broker-slave-2:/home/rocketmq/store
      - ./conf/broker-slave-2.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    depends_on:
      - rmqnamesrv
      - rmqbroker-master-2
    networks:
      - rocketmq-network

  # RocketMQ Console (可选，用于管理界面)
  rmqconsole:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: rmqconsole
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    networks:
      - rocketmq-network

networks:
  rocketmq-network:
    driver: bridge 