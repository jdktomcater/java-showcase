brokerClusterName = rocketmq-cluster
brokerName = broker-b
brokerId = 0
#这个很有讲究 如果是正式环境 这里一定要填写内网地址（安全）
#如果是用于测试或者本地这里建议要填外网地址，因为你的本地代码是无法连接到阿里云内网，只能连接外网。
# Docker Desktop (Mac/Win): host.docker.internal 供容器内控制台访问；宿主机 Java 客户端用 localhost:10912
brokerIP1 = host.docker.internal
deleteWhen = 04
fileReservedTime = 48
namesrvAddr=rmq-name-srv-a:9876;rmq-name-srv-b:9876
autoCreateTopicEnable=true
#Broker 对外服务的监听端口,
listenPort = 10912
#Broker角色
#- ASYNC_MASTER 异步复制Master
#- SYNC_MASTER 同步双写Master
#- SLAVE
brokerRole=ASYNC_MASTER
#刷盘方式
#- ASYNC_FLUSH 异步刷盘
#- SYNC_FLUSH 同步刷盘
flushDiskType=ASYNC_FLUSH

# --- 压测性能调优 (本地 Docker) ---
defaultTopicQueueNums=8
sendMessageThreadPoolNums=16
pullMessageThreadPoolNums=16